# Dodo Obsidian — Near-black volcanic glass, lit by a single amber ember.
[colors]
foreground = "#e4e1da"
background = "#111111"
cursor_bg = "#eda157"
cursor_fg = "#111111"
cursor_border = "#eda157"
selection_fg = "#e4e1da"
selection_bg = "#4a3623"
scrollbar_thumb = "#201f1e"
split = "#1e1e1c"
compose_cursor = "#f2d8a7"
ansi = ["#262624", "#ec7b6f", "#a6d6a0", "#f0c070", "#8fb0e6", "#cfa3e0", "#8ecfc5", "#d5d1c9"]
brights = ["#625f59", "#f49a90", "#c0e6bb", "#f6d391", "#adc6f0", "#e0bdec", "#ade0d9", "#f5f2eb"]

[colors.tab_bar]
background = "#080808"
inactive_tab_edge = "#1e1e1c"

[colors.tab_bar.active_tab]
bg_color = "#111111"
fg_color = "#e4e1da"

[colors.tab_bar.inactive_tab]
bg_color = "#0c0c0c"
fg_color = "#78756e"

[colors.tab_bar.inactive_tab_hover]
bg_color = "#201f1e"
fg_color = "#e4e1da"

[colors.tab_bar.new_tab]
bg_color = "#080808"
fg_color = "#78756e"

[colors.tab_bar.new_tab_hover]
bg_color = "#201f1e"
fg_color = "#e4e1da"

[metadata]
name = "Dodo Obsidian"
author = "Chris Nicholson"
origin_url = "https://github.com/chrisnicholson30/dodo-theme"
