# Dodo Obsidian — Volcanic black with sand-gold highlights.
[colors]
foreground = "#e1e4da"
background = "#141615"
cursor_bg = "#dcb575"
cursor_fg = "#141615"
cursor_border = "#dcb575"
selection_fg = "#e1e4da"
selection_bg = "#483f2e"
scrollbar_thumb = "#242823"
split = "#282d26"
compose_cursor = "#e5d2aa"
ansi = ["#2b3029", "#d58f87", "#afc49b", "#dcb575", "#9eb7d5", "#c1a8ce", "#92beb8", "#d0d6c7"]
brights = ["#858e80", "#e7aaa2", "#c7d8b3", "#ecd1a2", "#bacedf", "#d7c0df", "#b0d4cc", "#f1f4e9"]

[colors.tab_bar]
background = "#090b0a"
inactive_tab_edge = "#282d26"

[colors.tab_bar.active_tab]
bg_color = "#141615"
fg_color = "#e1e4da"

[colors.tab_bar.inactive_tab]
bg_color = "#0e100f"
fg_color = "#858e80"

[colors.tab_bar.inactive_tab_hover]
bg_color = "#242823"
fg_color = "#e1e4da"

[colors.tab_bar.new_tab]
bg_color = "#090b0a"
fg_color = "#858e80"

[colors.tab_bar.new_tab_hover]
bg_color = "#242823"
fg_color = "#e1e4da"

[metadata]
name = "Dodo Obsidian"
author = "Chris Nicholson"
origin_url = "https://github.com/chrisnicholson30/dodo-theme"
