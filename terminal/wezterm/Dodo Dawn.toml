# Dodo Dawn — Pale limestone and olive ink at first light.
[colors]
foreground = "#2c3029"
background = "#f6f4ed"
cursor_bg = "#5e7447"
cursor_fg = "#f6f4ed"
cursor_border = "#5e7447"
selection_fg = "#2c3029"
selection_bg = "#d8dacc"
scrollbar_thumb = "#e7e8dc"
split = "#d4d9c8"
compose_cursor = "#8d681e"
ansi = ["#353d30", "#b54e43", "#537341", "#8d681e", "#4e6792", "#815e9e", "#347479", "#cbd0bf"]
brights = ["#687160", "#bd5549", "#5a7948", "#906d22", "#547197", "#8b669e", "#3b7b79", "#e8ebdf"]

[colors.tab_bar]
background = "#e5e3da"
inactive_tab_edge = "#d4d9c8"

[colors.tab_bar.active_tab]
bg_color = "#f6f4ed"
fg_color = "#2c3029"

[colors.tab_bar.inactive_tab]
bg_color = "#eeece3"
fg_color = "#687160"

[colors.tab_bar.inactive_tab_hover]
bg_color = "#e7e8dc"
fg_color = "#2c3029"

[colors.tab_bar.new_tab]
bg_color = "#e5e3da"
fg_color = "#687160"

[colors.tab_bar.new_tab_hover]
bg_color = "#e7e8dc"
fg_color = "#2c3029"

[metadata]
name = "Dodo Dawn"
author = "Chris Nicholson"
origin_url = "https://github.com/chrisnicholson30/dodo-theme"
