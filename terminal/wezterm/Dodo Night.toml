# Dodo Night — Deep blue slate and moonlit feather-blue.
[colors]
foreground = "#e0e6ed"
background = "#1d222a"
cursor_bg = "#96b6e0"
cursor_fg = "#1d222a"
cursor_border = "#96b6e0"
selection_fg = "#e0e6ed"
selection_bg = "#3c4859"
scrollbar_thumb = "#2e3540"
split = "#323b48"
compose_cursor = "#e2bf87"
ansi = ["#353e4b", "#df9094", "#a7c49a", "#e2bf87", "#96b6e0", "#bcb0db", "#89c5bc", "#d0dae5"]
brights = ["#8d9aab", "#eeb0b2", "#c0dbb3", "#efd5a6", "#b5cef0", "#d2c5ea", "#a9ddd4", "#f1f5f9"]

[colors.tab_bar]
background = "#13171d"
inactive_tab_edge = "#323b48"

[colors.tab_bar.active_tab]
bg_color = "#1d222a"
fg_color = "#e0e6ed"

[colors.tab_bar.inactive_tab]
bg_color = "#181d24"
fg_color = "#8d9aab"

[colors.tab_bar.inactive_tab_hover]
bg_color = "#2e3540"
fg_color = "#e0e6ed"

[colors.tab_bar.new_tab]
bg_color = "#13171d"
fg_color = "#8d9aab"

[colors.tab_bar.new_tab_hover]
bg_color = "#2e3540"
fg_color = "#e0e6ed"

[metadata]
name = "Dodo Night"
author = "Chris Nicholson"
origin_url = "https://github.com/chrisnicholson30/dodo-theme"
