# Dodo Mist — Sea-fog grey with blue-grey coastal ink.
[colors]
foreground = "#29323a"
background = "#f2f5f6"
cursor_bg = "#4b7088"
cursor_fg = "#f2f5f6"
cursor_border = "#4b7088"
selection_fg = "#29323a"
selection_bg = "#d1dae0"
scrollbar_thumb = "#e1e9ec"
split = "#ccdbe0"
compose_cursor = "#966627"
ansi = ["#303e48", "#b44f51", "#47734e", "#966627", "#4b7088", "#835d9d", "#2a7775", "#c7d3d9"]
brights = ["#65717b", "#ba5559", "#4f7a56", "#977027", "#53778e", "#8c659e", "#317e7b", "#e5edf0"]

[colors.tab_bar]
background = "#dfe6e8"
inactive_tab_edge = "#ccdbe0"

[colors.tab_bar.active_tab]
bg_color = "#f2f5f6"
fg_color = "#29323a"

[colors.tab_bar.inactive_tab]
bg_color = "#e9eff0"
fg_color = "#65717b"

[colors.tab_bar.inactive_tab_hover]
bg_color = "#e1e9ec"
fg_color = "#29323a"

[colors.tab_bar.new_tab]
bg_color = "#dfe6e8"
fg_color = "#65717b"

[colors.tab_bar.new_tab_hover]
bg_color = "#e1e9ec"
fg_color = "#29323a"

[metadata]
name = "Dodo Mist"
author = "Chris Nicholson"
origin_url = "https://github.com/chrisnicholson30/dodo-theme"
