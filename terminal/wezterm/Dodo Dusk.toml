# Dodo Dusk — Warm graphite and lagoon teal as the island settles.
[colors]
foreground = "#e4e7de"
background = "#272b29"
cursor_bg = "#83b8a6"
cursor_fg = "#272b29"
cursor_border = "#83b8a6"
selection_fg = "#e4e7de"
selection_bg = "#3f504a"
scrollbar_thumb = "#373c37"
split = "#3a403a"
compose_cursor = "#dfbd82"
ansi = ["#3a413b", "#db8b83", "#b5c98d", "#dfbd82", "#96b4dd", "#c5acd9", "#83b8a6", "#cfd6cb"]
brights = ["#929d90", "#eba59c", "#cadba8", "#efd3a0", "#b2caec", "#dac3e8", "#a3d0bf", "#f2f4ec"]

[colors.tab_bar]
background = "#1a1d1c"
inactive_tab_edge = "#3a403a"

[colors.tab_bar.active_tab]
bg_color = "#272b29"
fg_color = "#e4e7de"

[colors.tab_bar.inactive_tab]
bg_color = "#202321"
fg_color = "#929d90"

[colors.tab_bar.inactive_tab_hover]
bg_color = "#373c37"
fg_color = "#e4e7de"

[colors.tab_bar.new_tab]
bg_color = "#1a1d1c"
fg_color = "#929d90"

[colors.tab_bar.new_tab_hover]
bg_color = "#373c37"
fg_color = "#e4e7de"

[metadata]
name = "Dodo Dusk"
author = "Chris Nicholson"
origin_url = "https://github.com/chrisnicholson30/dodo-theme"
