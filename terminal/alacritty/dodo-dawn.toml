# Dodo Dawn — Pale limestone and olive ink at first light.
# https://github.com/chrisnicholson30/dodo-theme

[colors.primary]
background = "#f6f4ed"
foreground = "#2c3029"
dim_foreground = "#687160"
bright_foreground = "#e8ebdf"

[colors.cursor]
cursor = "#5e7447"
text = "#f6f4ed"

[colors.vi_mode_cursor]
cursor = "#8d681e"
text = "#f6f4ed"

[colors.selection]
background = "#d8dacc"
text = "#2c3029"

[colors.search.matches]
background = "#d1c3a5"
foreground = "#2c3029"

[colors.search.focused_match]
background = "#5e7447"
foreground = "#f6f4ed"

[colors.footer_bar]
background = "#eeece3"
foreground = "#2c3029"

[colors.hints.start]
background = "#8d681e"
foreground = "#f6f4ed"

[colors.hints.end]
background = "#e7e8dc"
foreground = "#2c3029"

[colors.normal]
black = "#353d30"
