# Dodo Mist — Sea-fog grey with blue-grey coastal ink.
# https://github.com/chrisnicholson30/dodo-theme

[colors.primary]
background = "#f2f5f6"
foreground = "#29323a"
dim_foreground = "#65717b"
bright_foreground = "#e5edf0"

[colors.cursor]
cursor = "#4b7088"
text = "#f2f5f6"

[colors.vi_mode_cursor]
cursor = "#966627"
text = "#f2f5f6"

[colors.selection]
background = "#d1dae0"
