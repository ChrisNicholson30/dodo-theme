# Dodo Mist — Cool sea-fog grey with slate-feather ink.
# https://github.com/chrisnicholson30/dodo-theme

[colors.primary]
background = "#f7f8fa"
foreground = "#23262e"
dim_foreground = "#6e7486"
bright_foreground = "#eceef2"

[colors.cursor]
cursor = "#4d63b3"
text = "#f7f8fa"

[colors.vi_mode_cursor]
cursor = "#a85a0e"
text = "#f7f8fa"

[colors.selection]
background = "#d5daec"
text = "#23262e"

[colors.search.matches]
background = "#dbc1a7"
foreground = "#23262e"

[colors.search.focused_match]
background = "#4d63b3"
foreground = "#f7f8fa"

[colors.footer_bar]
background = "#eef0f3"
foreground = "#23262e"

[colors.hints.start]
background = "#a85a0e"
foreground = "#f7f8fa"

[colors.hints.end]
background = "#e8ebef"
foreground = "#23262e"

[colors.normal]
