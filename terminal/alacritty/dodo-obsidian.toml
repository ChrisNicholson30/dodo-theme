red = "#e7aaa2"
green = "#c7d8b3"
yellow = "#ecd1a2"
blue = "#bacedf"
magenta = "#d7c0df"
cyan = "#b0d4cc"
white = "#f1f4e9"

[colors.dim]
black = "#232722"
red = "#91655f"
