# Dodo Obsidian — Near-black volcanic glass, lit by a single amber ember.
# https://github.com/chrisnicholson30/dodo-theme

[colors.primary]
background = "#111111"
foreground = "#e4e1da"
dim_foreground = "#78756e"
bright_foreground = "#f5f2eb"

[colors.cursor]
cursor = "#eda157"
text = "#111111"

[colors.vi_mode_cursor]
cursor = "#f2d8a7"
text = "#111111"

[colors.selection]
background = "#4a3623"
text = "#e4e1da"

[colors.search.matches]
background = "#605746"
foreground = "#e4e1da"

[colors.search.focused_match]
background = "#eda157"
foreground = "#111111"

[colors.footer_bar]
background = "#0c0c0c"
foreground = "#e4e1da"

[colors.hints.start]
background = "#f2d8a7"
foreground = "#111111"

[colors.hints.end]
background = "#201f1e"
foreground = "#e4e1da"

[colors.normal]
black = "#262624"
