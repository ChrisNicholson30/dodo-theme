# Dodo Obsidian — Volcanic black with sand-gold highlights.
# https://github.com/chrisnicholson30/dodo-theme

[colors.primary]
background = "#141615"
foreground = "#e1e4da"
dim_foreground = "#858e80"
bright_foreground = "#f1f4e9"

[colors.cursor]
cursor = "#dcb575"
text = "#141615"

[colors.vi_mode_cursor]
cursor = "#e5d2aa"
text = "#141615"

[colors.selection]
background = "#483f2e"
text = "#e1e4da"

[colors.search.matches]
background = "#5d5849"
foreground = "#e1e4da"

[colors.search.focused_match]
background = "#dcb575"
foreground = "#141615"

[colors.footer_bar]
background = "#0e100f"
foreground = "#e1e4da"

[colors.hints.start]
background = "#e5d2aa"
foreground = "#141615"

[colors.hints.end]
background = "#242823"
foreground = "#e1e4da"

[colors.normal]
black = "#2b3029"
