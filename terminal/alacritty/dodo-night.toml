# Dodo Night — Deep blue slate and moonlit feather-blue.
# https://github.com/chrisnicholson30/dodo-theme

[colors.primary]
background = "#1d222a"
foreground = "#e0e6ed"
dim_foreground = "#8d9aab"
bright_foreground = "#f1f5f9"

[colors.cursor]
cursor = "#96b6e0"
text = "#1d222a"

[colors.vi_mode_cursor]
cursor = "#e2bf87"
